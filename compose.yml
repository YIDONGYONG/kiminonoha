services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    ports:
      # 他のPostgreSQLが5432を使っていても衝突しないよう、ホスト側は5433にする
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis:/var/lib/redis

  web:
    build: .
    command: >
      bash -c "
        bundle install &&
        bundle exec rails db:prepare &&
        rm -f tmp/pids/server.pid &&
        yarn install &&
        ./bin/dev
      "
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle:cached
      - node_modules:/app/node_modules
    depends_on:
      - db
      - redis

volumes:
  pg_data:
  bundle_data:
  node_modules:
  redis:
