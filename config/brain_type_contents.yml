Cheetah:
  title: チーター
  emoji: "🐆"
  subtitle: 圧倒的なスピードと即断即決
  summary: 直感と行動力で道を切り拓くタイプ。**動きながら修正する**のが得意です。
  strengths:
    - 決断が早く、すぐ着手できる
    - 失敗を恐れず試行錯誤を回せる
    - 周囲を巻き込むエネルギーがある
  weaknesses:
    - 確認を省いて細かなミスをしやすい
    - 地道な作業に飽きやすい
    - 周囲を置き去りにすることがある
  learning: |
    **短く区切る**と力を発揮します。25分集中して5分休む、1日1テーマに絞る、小テストですぐ答え合わせをするなど、成果がすぐ見える形にしましょう。聞いた内容は**直後にアウトプット**するのがコツです。
  work: |
    立ち上げ期の企画や営業など、**スピード勝負の場面**で活躍します。仕上げの見直しは後回しになりがちなので、チェックリストを用意すると信頼度が上がります。
  relationships: |
    結論から伝える一方、**「どう思う？」の一言**を添えると、相手のペースも尊重できて関係がぐっと良くなります。
  careers: [起業・新規事業, 営業・販売, イベント企画, スポーツ関連]
  tips:
    - 今日いちばんやりたいことを5分だけ実行する
    - 計画は3行にまとめ、細部は走りながら決める
    - 週に一度、立ち止まって振り返る
  faq:
    - q: 飽きっぽいのですか？
      a: 変化や刺激でやる気が高まるタイプです。小さなゴールを次々に作ると長く続きます。
    - q: 慎重な人と協力するには？
      a: 先に「何を決めて、何を後で調整するか」を共有しておくと進めやすくなります。
Owl:
  title: フクロウ
  emoji: "🦉"
  subtitle: 冷静沈着な分析家
  summary: 論理と根拠で判断するタイプ。**静かに深く考える時間**が力になります。
  strengths:
    - 情報を整理し、本質を見抜ける
    - 感情に流されず客観的に判断できる
    - 長期的な戦略を立てられる
  weaknesses:
    - 分析しすぎて行動が遅れがち
    - 根拠のない指示が苦手
    - 考えが周囲に伝わりにくい
  learning: |
    **「なぜ？」を理解してから覚える**と定着します。マインドマップや図解で全体像を描き、静かな環境でまとまった時間を確保しましょう。学んだことを自分の言葉でまとめ直すのも効果的です。
  work: |
    分析・設計・執筆など、**深い思考が必要な仕事**で力を発揮します。完璧を目指して着手が遅れがちなので、**70%の段階で一度共有**すると手戻りが減ります。
  relationships: |
    口数が少なく冷たく見られることも。**結論に至った理由を短く共有**するだけで、信頼は大きく高まります。
  careers: [データ分析・研究, エンジニア・設計, 編集・ライター, コンサルティング]
  tips:
    - 今日学んだことを一つ、整理して書き留める
    - 決断の期限を先に決めてから分析する
    - 考えを言葉にして、週に一度誰かに共有する
  faq:
    - q: 慎重すぎますか？
      a: 慎重さは強みです。「ここまで分かれば動く」という基準を持つと、強みを活かしたまま行動できます。
    - q: 雑談が苦手なのは短所ですか？
      a: 短所とは限りません。少人数やテーマ付きの対話から慣れていきましょう。
Elephant:
  title: ゾウ
  emoji: "🐘"
  subtitle: 確かな記憶と安定感
  summary: 経験を積み重ねて着実に進むタイプ。**安定した環境**で強みが光ります。
  strengths:
    - 学んだことをしっかり記憶し応用できる
    - 粘り強く安定した成果を出せる
    - 周囲に安心感を与える責任感がある
  weaknesses:
    - 急な変更や未経験の状況が苦手
    - 前例にこだわり、新しい方法に時間がかかる
    - 一人で抱え込みやすい
  learning: |
    **順序立てて繰り返す**学習が最適です。基礎から段階的に積み上げ、**間隔をあけて復習**すると長期記憶に残ります。新しい分野は、すでに知っていることとの共通点から入りましょう。
  work: |
    経理・品質管理・教育など、**正確さと継続性が求められる仕事**で信頼されます。変化には**まず小さく試す**ところから始めると安心です。
  relationships: |
    約束を守るため厚い信頼を得ます。不満は溜めがちなので、**小さな違和感のうちに伝える**習慣が長続きの秘訣です。
  careers: [教育・研修, 経理・総務, 品質管理・運用, 図書館・アーカイブ]
  tips:
    - 過去に学んだことを一つ思い出して今に活かす
    - 新しいことは小さく試す
    - 困ったら早めに相談する
  faq:
    - q: 変化が苦手ですか？
      a: 変化より見通しの立たない状況が苦手です。手順と目的を先に共有してもらうと落ち着いて動けます。
    - q: 記憶力を活かす勉強法は？
      a: 1日後・3日後・1週間後に見直す復習スケジュールが効果的です。
Dolphin:
  title: イルカ
  emoji: "🐬"
  subtitle: 調和と共感のメッセンジャー
  summary: 対話とつながりから力を得るタイプ。**共感力でチームをまとめます**。
  strengths:
    - 相手の気持ちを察し安心できる場を作れる
    - 対話で意見をまとめられる
    - さまざまな立場の人と関係を築ける
  weaknesses:
    - 他人の評価を気にして意見を後回しにしがち
    - 対立を避けて指摘を先延ばしにする
    - 孤独な作業が続くと意欲が下がる
  learning: |
    **誰かと一緒に学ぶ**と伸びます。勉強会やペア学習、**人に教えること**が最も効果的です。「この知識を誰の役に立てたいか」を意識すると、続けやすくなります。
  work: |
    チーム運営・接客・人事・広報など、**人と関わる仕事**で真価を発揮します。意見は**「私はこう考えます」**と主語を自分にして伝える練習が効果的です。
  relationships: |
    聞き上手で相談されることも多いタイプ。頑張りすぎないよう、**一人で回復する時間**も意識して確保しましょう。
  careers: [人事・採用, 接客・サービス, カウンセラー・コーチ, 広報・コミュニティ運営]
  tips:
    - 大切な人に感謝のメッセージを送る
    - 自分の意見を一日一回言葉にする
    - 一人で休む時間も予定に入れる
  faq:
    - q: 優柔不断ですか？
      a: 周囲への配慮で慎重になるだけです。先に「自分はどうしたいか」を書き出すと迷いが減ります。
    - q: 一人作業のコツは？
      a: 作業の前後に進捗を誰かに共有すると、集中が続きます。
