# PostgreSQL。開発・テストはDocker Compose、本番はNeonを使う。
# 本番は環境変数 DATABASE_URL（Neonの接続文字列）が、この設定より優先される。
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "db" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USER") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>

development:
  <<: *default
  database: myapp_development

# 注意: "test" のデータベースは rake 実行時に開発DBから再生成され、内容が消える。
# 開発DBと同じ名前にしないこと。
test:
  <<: *default
  database: app_test

# 本番は DATABASE_URL で接続する（Neonの「Direct connection」の接続文字列を使う）
production:
  <<: *default
  database: app_production
